# Builds and tests Lathe on macOS, Windows and Linux. Runs only when you start
# it: Actions tab -> "Build" -> "Run workflow", then pick what to build in
# "Use workflow from".
#
# - A branch (e.g. main): build, test, and keep the packaged apps as run
#   artifacts for 30 days.
# - A version tag (v1.2.3): the same builds, then a *draft* GitHub release is
#   created with the three archives attached and the text from
#   .github/release-notes.md. Review it on the Releases page and publish.
#   The tag must match project(Lathe VERSION ...) in CMakeLists.txt.

name: Build

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  JUCE_VERSION: "8.0.9"

jobs:
  build:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macOS
            os: macos-latest
          - platform: Windows
            os: windows-latest
          - platform: Linux
            os: ubuntu-latest
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v7

      - name: Check the tag matches the version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(sed -n 's/^project(Lathe VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match CMakeLists.txt (VERSION $version). Update project(Lathe VERSION ...), commit, and move the tag."
            exit 1
          fi

      - name: Restore JUCE
        id: juce-cache
        uses: actions/cache@v6
        with:
          path: .juce
          key: juce-${{ env.JUCE_VERSION }}-${{ runner.os }}

      - name: Download JUCE
        if: steps.juce-cache.outputs.cache-hit != 'true'
        run: git clone --depth 1 --branch "$JUCE_VERSION" https://github.com/juce-framework/JUCE.git .juce

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libfreetype-dev libfontconfig1-dev libgl1-mesa-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev \
            libxinerama-dev libxrandr-dev libxrender-dev libcurl4-openssl-dev

      # Windows: the ASIO SDK (for audio interfaces' ASIO drivers) is fetched by CMake.
      - name: Configure
        run: |
          extra=()
          case "$RUNNER_OS" in
            Windows) extra+=(-A x64) ;;
            macOS)   extra+=("-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64") ;;
          esac
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DLATHE_JUCE_DIR=.juce \
            -DLATHE_BUILD_TESTS=ON \
            "${extra[@]}"

      - name: Build
        run: cmake --build build --config Release --parallel 4

      # Engine, plug-in store and scanning tests. The scanning tests use three
      # test plug-ins built above: one that works, one that crashes and one that
      # hangs. Lathe must skip the last two without crashing or freezing.
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      # macOS: sign with a Developer ID and notarize, so the app opens with a double-click.
      # Needs the secrets MACOS_CERT_P12 (base64 .p12), MACOS_CERT_PASSWORD,
      # MACOS_SIGN_IDENTITY, NOTARY_KEY_P8 (base64 .p8), NOTARY_KEY_ID, NOTARY_ISSUER_ID.
      # A version tag without them fails here, so every released Mac build is notarized.
      # Branch builds without them keep the local (ad-hoc) signature, for testing only.
      - name: Sign and notarize (macOS)
        if: runner.os == 'macOS'
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          if [ -z "$MACOS_CERT_P12" ]; then
            if [ "$GITHUB_REF_TYPE" = "tag" ]; then
              echo "::error::Releases must be signed and notarized: the macOS signing secrets are missing."
              exit 1
            fi
            echo "No signing secrets: this branch build keeps its local signature (for testing, not for release)."
            exit 0
          fi
          set -euo pipefail
          keychain="$RUNNER_TEMP/signing.keychain-db"
          kpass="$(uuidgen)"
          echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$kpass" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$kpass" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$kpass" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')

          app=build/Lathe_artefacts/Release/Lathe.app
          ents=Resources/Lathe.entitlements
          sign() { codesign --force --timestamp --options runtime --sign "$MACOS_SIGN_IDENTITY" "$@"; }
          # Inside out: helpers first, then the app around them.
          sign "$app/Contents/Helpers/LathePatcher.app"
          sign "$app/Contents/MacOS/LatheMCP"
          sign --entitlements "$ents" "$app/Contents/MacOS/LatheScanner"
          sign --entitlements "$ents" "$app/Contents/MacOS/LatheHost"
          sign --entitlements "$ents" "$app"
          codesign --verify --deep --strict --verbose=2 "$app"

          echo "$NOTARY_KEY_P8" | base64 --decode > "$RUNNER_TEMP/notary.p8"
          ditto -c -k --keepParent "$app" "$RUNNER_TEMP/notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" --wait \
            --key "$RUNNER_TEMP/notary.p8" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER_ID"
          xcrun stapler staple "$app"
          spctl --assess --type execute --verbose "$app"

      # Package the app ourselves so file permissions and the macOS signature
      # survive the download. LatheScanner (the plug-in scan helper), LatheHost (runs a
      # plug-in set to "Run separately"), LatheMCP
      # (the AI assistant bridge) and LathePatcher (the updater) must ship with
      # Lathe, so check they're there. docs/ (the user guide) goes in beside them.
      - name: Package
        run: |
          version=$(sed -n 's/^project(Lathe VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          name="Lathe-${version}-${{ matrix.platform }}"
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then name="${name}-${GITHUB_SHA::7}"; fi
          art=build/Lathe_artefacts/Release
          stage="$RUNNER_TEMP/$name"
          mkdir -p "$stage"
          case "$RUNNER_OS" in
            macOS)
              cp -R "$art/Lathe.app" "$stage/"
              test -x "$stage/Lathe.app/Contents/MacOS/LatheScanner"
              test -x "$stage/Lathe.app/Contents/MacOS/LatheHost"
              test -x "$stage/Lathe.app/Contents/MacOS/LatheMCP"
              test -x "$stage/Lathe.app/Contents/Helpers/LathePatcher.app/Contents/MacOS/LathePatcher"
              codesign --verify --deep --strict "$stage/Lathe.app" ;;
            Windows)
              cp "$art/Lathe.exe" "$art/LatheScanner.exe" "$art/LatheHost.exe" "$art/LatheMCP.exe" "$art/LathePatcher.exe" "$stage/"
              # The C++ runtime is linked in: nothing may need the Visual C++ Redistributable.
              for exe in "$stage"/*.exe; do
                if grep -a -i -q -E "msvcp140|vcruntime140" "$exe"; then
                  echo "::error::$(basename "$exe") needs the Visual C++ Redistributable (MSVCP140/VCRUNTIME140); it must link the runtime statically."
                  exit 1
                fi
              done ;;
            Linux)
              cp "$art/Lathe" "$art/LatheScanner" "$art/LatheHost" "$art/LatheMCP" "$art/LathePatcher" "$stage/" ;;
          esac
          cp README.md LICENSE "$stage/"
          cp -R docs "$stage/docs"   # the user guide (Markdown), until it's on getlathe.app
          case "$RUNNER_OS" in
            macOS)
              ditto -c -k --sequesterRsrc --keepParent "$stage" "$GITHUB_WORKSPACE/$name.zip"
              echo "ARCHIVE=$name.zip" >> "$GITHUB_ENV" ;;
            Windows)
              (cd "$RUNNER_TEMP" && 7z a -tzip "$GITHUB_WORKSPACE/$name.zip" "$name" > /dev/null)
              echo "ARCHIVE=$name.zip" >> "$GITHUB_ENV" ;;
            Linux)
              tar -czf "$GITHUB_WORKSPACE/$name.tar.gz" -C "$RUNNER_TEMP" "$name"
              echo "ARCHIVE=$name.tar.gz" >> "$GITHUB_ENV" ;;
          esac

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ARCHIVE }}
          path: ${{ env.ARCHIVE }}
          archive: false
          if-no-files-found: error
          retention-days: 30

  # Multi-core rendering (docs/multicore.md) under ThreadSanitizer: every engine test with
  # each block shared over 4 threads, and random sessions compared with one thread. Any data
  # race between the audio thread and the workers fails the build.
  thread-check:
    name: Thread check (Linux, ThreadSanitizer)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Restore JUCE
        id: juce-cache
        uses: actions/cache@v6
        with:
          path: .juce
          key: juce-${{ env.JUCE_VERSION }}-${{ runner.os }}

      - name: Download JUCE
        if: steps.juce-cache.outputs.cache-hit != 'true'
        run: git clone --depth 1 --branch "$JUCE_VERSION" https://github.com/juce-framework/JUCE.git .juce

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libfreetype-dev libfontconfig1-dev libgl1-mesa-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev \
            libxinerama-dev libxrandr-dev libxrender-dev libcurl4-openssl-dev

      - name: Configure (ThreadSanitizer)
        run: |
          cmake -B build-tsan \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DLATHE_JUCE_DIR=.juce \
            -DLATHE_BUILD_TESTS=ON \
            -DLATHE_TEST_FIXTURES=OFF \
            -DCMAKE_C_FLAGS=-fsanitize=thread -DCMAKE_CXX_FLAGS=-fsanitize=thread \
            -DCMAKE_EXE_LINKER_FLAGS=-fsanitize=thread -DCMAKE_SHARED_LINKER_FLAGS=-fsanitize=thread \
            -DCMAKE_MODULE_LINKER_FLAGS=-fsanitize=thread

      - name: Build
        run: cmake --build build-tsan --parallel 4 --target LatheTests

      - name: Engine tests on 4 threads
        env:
          LATHE_TEST_THREADS: "4"
          TSAN_OPTIONS: "halt_on_error=1 second_deadlock_stack=1"
        run: ./build-tsan/LatheTests_artefacts/RelWithDebInfo/LatheTests

      - name: Random sessions, 1 vs 4 threads
        env:
          TSAN_OPTIONS: "halt_on_error=1"
        run: ./build-tsan/LatheTests_artefacts/RelWithDebInfo/LatheTests --random 60 4

  release:
    name: Draft release
    needs: [build, thread-check]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Collect the builds
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
          skip-decompress: true

      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la dist
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* \
              --draft \
              --verify-tag \
              --title "Lathe ${GITHUB_REF_NAME#v}" \
              --notes-file .github/release-notes.md
          fi
